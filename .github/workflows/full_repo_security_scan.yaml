name: full_repo_security_scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: full-repo-security-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.76.1
  TRIVY_SEVERITY: CRITICAL

  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan_repository:
    name: Full Repository Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 1. SECRET SCANNING (Gitleaks)
      # -----------------------------------------------------------------------
      - name: Install Gitleaks
        id: gitleaks_install
        continue-on-error: true
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION#v}"
          tmp_dir="$(mktemp -d)"
          cleanup() { rm -rf "$tmp_dir"; }
          trap cleanup EXIT

          archive="$tmp_dir/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/security-tools"
          gitleaks_bin="$install_dir/gitleaks"

          echo "============================================================"
          echo " Gitleaks Installation"
          echo "============================================================"
          echo "[INFO] Downloading Gitleaks ${GITLEAKS_VERSION}"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --output "$archive" \
            "$url"

          echo "[INFO] Verifying Gitleaks SHA-256"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status

          install -d -m 0755 "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$tmp_dir" --no-same-owner
          test -f "$tmp_dir/gitleaks"
          install -m 0755 "$tmp_dir/gitleaks" "$gitleaks_bin"
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          test -x "$gitleaks_bin"
          "$gitleaks_bin" version

      - name: Run Gitleaks full Git history scan
        id: gitleaks
        if: ${{ always() && steps.gitleaks_install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " Gitleaks - Full Git History"
          echo "============================================================"
          gitleaks \
            git \
            --log-opts="--all --full-history" \
            --redact \
            --no-banner \
            --exit-code 1 \
            .

      # -----------------------------------------------------------------------
      # 2. VULNERABILITY & MISCONFIGURATION SCANNING (Trivy)
      # -----------------------------------------------------------------------
      - name: Run Trivy filesystem vulnerability and IaC scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-results.json
          timeout: 15m
          cache: true

          # Exclude generated/dependency/build directories and large binary models
          skip-dirs: >-
            .git,
            **/.git,
            **/.venv,
            **/venv,
            **/node_modules,
            **/target,
            **/dist,
            **/__pycache__,
            **/.pytest_cache,
            **/.mypy_cache,
            **/.ruff_cache,
            **/.terraform,
            src/dense-service/embedder,
            src/indexing_pipeline/embedders,
            src/llm-service/models,
            infra/k8s/generated

      - name: Print Trivy findings and diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          TRIVY_REPORT: ${{ runner.temp }}/trivy-results.json
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " Trivy Report Diagnostics"
          echo "============================================================"
          echo "[INFO] Trivy step outcome: ${TRIVY_OUTCOME}"
          echo "[INFO] Expected report: ${TRIVY_REPORT}"

          if [[ ! -s "$TRIVY_REPORT" ]]; then
            echo "::error::Trivy did not create a non-empty JSON report. The cause is likely a scanner/setup error."
            exit 0
          fi

          if ! jq -e 'type == "object" and ((.Results == null) or (.Results | type == "array"))' "$TRIVY_REPORT" >/dev/null; then
            echo "::error::Trivy report exists but is not valid JSON in the expected format."
            echo "[DIAGNOSTIC] First 80 lines of the report follow:"
            sed -n '1,80p' "$TRIVY_REPORT"
            exit 0
          fi

          critical_vulns="$(jq '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "CRITICAL")] | length' "$TRIVY_REPORT")"
          critical_misconfigs="$(jq '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity == "CRITICAL")] | length' "$TRIVY_REPORT")"
          critical_secrets="$(jq '[.Results[]? | (.Secrets // [])[]? | select(.Severity == "CRITICAL")] | length' "$TRIVY_REPORT")"

          details_file="$RUNNER_TEMP/trivy-critical-findings.txt"

          jq -r '
            .Results[]? as $result
            | (
                (($result.Vulnerabilities // []) | map(. + {finding_kind: "vulnerability"}))
                + (($result.Misconfigurations // []) | map(. + {finding_kind: "misconfiguration"}))
                + (($result.Secrets // []) | map(. + {finding_kind: "secret"}))
              )[]?
            | select(.Severity == "CRITICAL")
            | "[CRITICAL] \(.finding_kind) | target=\($result.Target // "unknown target") | id=\(.VulnerabilityID // .ID // .RuleID // "unknown") | package=\(.PkgName // "-") | installed=\(.InstalledVersion // "-") | fixed=\(.FixedVersion // "-") | title=\(.Title // .Message // .Description // "No description" | gsub("[\r\n]+"; " "))"
          ' "$TRIVY_REPORT" > "$details_file" || true

          finding_count="$(wc -l < "$details_file" | tr -d '[:space:]')"
          max_console_findings=200

          {
            echo "### Trivy scan diagnostics"
            echo "- Trivy step outcome: ${TRIVY_OUTCOME}"
            echo "- Critical vulnerabilities: ${critical_vulns}"
            echo "- Critical misconfigurations: ${critical_misconfigs}"
            echo "- Critical secrets: ${critical_secrets}"
            echo "- Critical findings listed below: ${finding_count}"
            echo ""
            if [[ "$finding_count" -eq 0 ]]; then
              echo "No CRITICAL findings were present in the JSON report. If the Trivy step still failed, inspect its logs for a scanner/runtime error."
            else
              echo "#### Critical findings (up to ${max_console_findings})"
              sed -n "1,${max_console_findings}p" "$details_file"
              if [[ "$finding_count" -gt "$max_console_findings" ]]; then
                echo "[INFO] Console/summary output truncated to ${max_console_findings} of ${finding_count} findings."
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-report
          path: ${{ runner.temp }}/trivy-results.json
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------------------
      # 3. EVALUATE RESULTS
      # -----------------------------------------------------------------------
      - name: Evaluate security scan results
        if: ${{ always() }}
        env:
          GITLEAKS_INSTALL_OUTCOME: ${{ steps.gitleaks_install.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          failed=0

          echo "============================================================"
          echo " Security Scan Summary"
          echo "============================================================"

          # 1. Check Gitleaks
          if [[ "$GITLEAKS_INSTALL_OUTCOME" != "success" ]]; then
            echo "[FAIL] Gitleaks installation failed."
            failed=1
          elif [[ "$GITLEAKS_OUTCOME" == "success" ]]; then
            echo "[PASS] Gitleaks (No secrets found)"
          else
            echo "[FAIL] Gitleaks reported findings or did not complete successfully."
            failed=1
          fi

          # 2. Check Trivy
          if [[ "$TRIVY_OUTCOME" == "success" ]]; then
            echo "[PASS] Trivy (No blocking findings)"
          elif [[ "$TRIVY_OUTCOME" == "skipped" ]]; then
            echo "[FAIL] Trivy was skipped."
            failed=1
          else
            echo "[FAIL] Trivy reported blocking findings or encountered a scanner error. See the report and Trivy logs."
            failed=1
          fi

          echo "============================================================"
          if [[ "$failed" -ne 0 ]]; then
            echo "[ERROR] One or more security checks failed."
            exit 1
          fi

          echo "[SUCCESS] Security scan completed with no blocking findings."
