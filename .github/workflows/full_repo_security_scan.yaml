name: full_repo_security_scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: full-repo-security-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.76.1
  TRIVY_SEVERITY: CRITICAL

  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan_repository:
    name: Full Repository Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 1. SECRET SCANNING (Gitleaks)
      # -----------------------------------------------------------------------
      - name: Install Gitleaks
        id: gitleaks_install
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION#v}"
          tmp_dir="$(mktemp -d)"
          cleanup() { rm -rf "$tmp_dir"; }
          trap cleanup EXIT

          archive="$tmp_dir/gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/security-tools"
          gitleaks_bin="$install_dir/gitleaks"

          echo "[INFO] Downloading Gitleaks ${GITLEAKS_VERSION}"
          curl -sSfL --retry 3 --connect-timeout 10 --max-time 300 -o "$archive" "$url"

          echo "[INFO] Verifying Gitleaks SHA-256"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status

          install -d -m 0755 "$install_dir"
          tar -xzf "$archive" -C "$tmp_dir" --no-same-owner
          install -m 0755 "$tmp_dir/gitleaks" "$gitleaks_bin"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run Gitleaks full Git history scan
        id: gitleaks
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " Gitleaks - Full Git History"
          echo "============================================================"

          # Use --report-path to save the exact finding details.
          # We omit --redact here so the report contains the file names and line numbers.
          # (The report is not uploaded as an artifact, so secrets are not exposed publicly).
          gitleaks git \
            --log-opts="--all --full-history" \
            --no-banner \
            --exit-code 1 \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --report-format json \
            . || echo "GITLEAKS_FAILED=true" >> $GITHUB_ENV

      - name: Print Gitleaks findings (if failed)
        if: env.GITLEAKS_FAILED == 'true'
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " GITLEAKS FAILED - DETAILS BELOW"
          echo "============================================================"
          if [ ! -f "$RUNNER_TEMP/gitleaks-report.json" ]; then
            echo "::error::Gitleaks exited with an error but did not produce a report file."
            exit 1
          fi

          echo "The following secrets were found in your Git history:"
          jq -r '.[] | "[LEAK] File: \(.File) | Line: \(.StartLine) | Commit: \(.Commit) | Rule: \(.RuleID) | Match: \(.Match)"' "$RUNNER_TEMP/gitleaks-report.json"

          echo "============================================================"
          echo "To fix this:"
          echo "1. Find the exact commit: git log -S \"<Match>\" --all"
          echo "2. If it's a real secret, rotate it and use git-filter-repo to remove it."
          echo "3. If it's a false positive, add the file to .gitleaks.toml or use #gitleaks:allow"
          echo "============================================================"
          exit 1

      # -----------------------------------------------------------------------
      # 2. VULNERABILITY & MISCONFIGURATION SCANNING (Trivy)
      # -----------------------------------------------------------------------
      - name: Run Trivy filesystem vulnerability and IaC scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-results.json
          timeout: 15m
          cache: true
          skip-dirs: >-
            .git,
            **/.git,
            **/.venv,
            **/venv,
            **/node_modules,
            **/target,
            **/dist,
            **/__pycache__,
            **/.pytest_cache,
            **/.mypy_cache,
            **/.ruff_cache,
            **/.terraform,
            src/dense-service/embedder,
            src/indexing_pipeline/embedders,
            src/llm-service/models,
            infra/k8s/generated

      - name: Print Trivy findings and diagnostics
        if: ${{ always() && steps.trivy.outcome != 'success' }}
        env:
          TRIVY_REPORT: ${{ runner.temp }}/trivy-results.json
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " TRIVY FAILED - DETAILS BELOW"
          echo "============================================================"
          if [[ ! -s "$TRIVY_REPORT" ]]; then
            echo "::error::Trivy did not create a non-empty JSON report. Check the Trivy step logs."
            exit 1
          fi

          echo "The following CRITICAL vulnerabilities/misconfigurations were found:"
          jq -r '
            .Results[]? as $result
            | (
                (($result.Vulnerabilities // []) | map(. + {finding_kind: "vulnerability"}))
                + (($result.Misconfigurations // []) | map(. + {finding_kind: "misconfiguration"}))
                + (($result.Secrets // []) | map(. + {finding_kind: "secret"}))
              )[]?
            | select(.Severity == "CRITICAL")
            | "[CRITICAL] \(.finding_kind) | File: \($result.Target) | ID: \(.VulnerabilityID // .ID // .RuleID) | Package: \(.PkgName // "-") | Fix: \(.FixedVersion // "none")"
          ' "$TRIVY_REPORT"
          exit 1

      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-report
          path: ${{ runner.temp }}/trivy-results.json
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------------------
      # 3. EVALUATE RESULTS
      # -----------------------------------------------------------------------
      - name: Evaluate security scan results
        if: ${{ always() }}
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          failed=0

          echo "============================================================"
          echo " Security Scan Summary"
          echo "============================================================"

          if [[ "$GITLEAKS_OUTCOME" == "success" ]]; then
            echo "[PASS] Gitleaks (No secrets found)"
          else
            echo "[FAIL] Gitleaks reported findings. See the step above."
            failed=1
          fi

          if [[ "$TRIVY_OUTCOME" == "success" ]]; then
            echo "[PASS] Trivy (No blocking findings)"
          else
            echo "[FAIL] Trivy reported findings. See the step above."
            failed=1
          fi

          echo "============================================================"
          if [[ "$failed" -ne 0 ]]; then
            echo "[ERROR] One or more security checks failed."
            exit 1
          fi
